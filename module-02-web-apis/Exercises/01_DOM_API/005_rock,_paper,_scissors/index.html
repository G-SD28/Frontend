<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto">
      <div class="rounded-lg bg-white p-6 text-center shadow-lg">
        <div class="mb-4">
          <h2 class="text-2xl font-bold">Score</h2>
          <div class="mt-2 flex justify-between">
            <div>User: <span id="user-score">0</span></div>
            <div>Computer: <span id="computer-score">0</span></div>
          </div>
        </div>
        <div class="mb-4">
          <h3 class="mb-2 text-xl font-semibold">Choose:</h3>
          <div id="selection" class="flex justify-around gap-3">
            <button class="rounded bg-blue-400 px-4 py-2 text-white" id="rock">
              <span role="img" aria-label="rock">🪨</span>
            </button>
            <button class="rounded bg-green-400 px-4 py-2 text-white" id="paper">
              <span role="img" aria-label="paper">📄</span>
            </button>
            <button class="rounded bg-red-400 px-4 py-2 text-white" id="scissors">
              <span role="img" aria-label="scissors">✂️</span>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <h3 class="mb-2 text-xl font-semibold">Result:</h3>
          <div id="result" class="rounded bg-gray-200 py-4">No result yet</div>
        </div>
        <button class="mt-4 rounded bg-purple-500 px-4 py-2 text-white" id="play-button">
          Play Round
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
